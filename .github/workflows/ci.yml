name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync and test
        run: |
          uv sync --group test
          uv run pytest -q

  thesis-radar-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/thesis-radar/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/thesis-radar/web/package-lock.json

      - run: npm ci
      - run: npm run build

  thesis-radar-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/thesis-radar/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync API (imports signal-engine)
        run: uv sync
