name: Signal Digest

on:
  schedule:
    # Every 2 hours UTC — 12 runs/day; thesis rotates via schedule_thesis.py
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      thesis:
        description: Optional thesis config path (under signal-engine/)
        required: false
        default: ""

concurrency:
  group: signal-pipeline
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group test

      - name: Select thesis
        id: thesis
        run: |
          if [ -n "${{ github.event.inputs.thesis }}" ]; then
            echo "path=${{ github.event.inputs.thesis }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=$(uv run python scripts/schedule_thesis.py)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_DIGEST_INBOX_ID: ${{ secrets.AGENTMAIL_DIGEST_INBOX_ID }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          LLM_SCORE_CONCURRENCY: ${{ secrets.LLM_SCORE_CONCURRENCY }}
          LLM_SCORE_MAX_SIGNALS: ${{ secrets.LLM_SCORE_MAX_SIGNALS }}
        run: uv run python -m signal_engine.pipeline --thesis "${{ steps.thesis.outputs.path }}"

      - name: Commit digest archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../docs/SIGNAL_DIGEST.md ../docs/HAIR_ON_FIRE_ANALYSIS.md ../docs/digests/
          git diff --staged --quiet || git commit -m "chore: signal digest $(date -u +%Y-%m-%dT%H00Z)"
          git push
