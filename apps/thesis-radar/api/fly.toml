# fly.toml app configuration file generated for thesis-radar-api
#
# Deploy from repo root:
#   fly deploy --config apps/thesis-radar/api/fly.toml

app = 'thesis-radar-api'
primary_region = 'iad'

[build]
  dockerfile = 'apps/thesis-radar/api/Dockerfile'

[env]
  SIGNAL_ENGINE_ROOT = '/app'
  DEFAULT_THESIS_PATH = '/app/signal-engine/config/thesis_recruiting_ta.yaml'
  LLM_PROVIDER_ORDER = 'nvidia,gemini'
  NVIDIA_NIM_BASE_URL = 'https://integrate.api.nvidia.com/v1'
  NVIDIA_NIM_MODEL = 'meta/llama-4-maverick-17b-128e-instruct'
  GEMINI_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta/openai/'
  GEMINI_MODEL = 'gemini-2.0-flash'
  LANGCHAIN_TRACING_V2 = 'false'
  LANGCHAIN_PROJECT = 'thesis-radar'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
